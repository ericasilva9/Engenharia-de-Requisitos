<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do sócio | Clubify</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="painel">
  <header class="top" id="topo"></header>

  <main>
    <div class="wrap" style="padding-top:48px">
      <div class="adm-top">
        <div><h1 style="font-size:34px" id="saudacao">Olá!</h1><span class="ul"></span></div>
        <div style="display:flex;gap:12px">
          <a class="btn sec" href="perfil.html">Meu perfil</a>
          <a class="btn" href="cadastro.html">+ Nova inscrição</a>
        </div>
      </div>

      <div class="grid g3">
        <div class="card stat"><div class="muted">Inscrições ativas</div><div class="n" id="st-ativas">0</div></div>
        <div class="card stat"><div class="muted">Próxima mensalidade</div><div class="n" id="st-prox">—</div></div>
        <div class="card stat"><div class="muted">Documentos</div><div class="n" id="st-docs">—</div></div>
      </div>

      <h2 style="margin:44px 0 16px;font-size:22px">Minhas inscrições</h2>
      <div class="card tabela"><table>
        <thead><tr><th>Modalidade</th><th>Turma</th><th>Valor</th><th>Status</th></tr></thead>
        <tbody id="tab-inscricoes"></tbody></table></div>

      <h2 style="margin:44px 0 16px;font-size:22px">Mensalidades</h2>
      <div class="card tabela"><table>
        <thead><tr><th>Mês</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead>
        <tbody id="tab-mensalidades"></tbody></table></div>
    </div>
  </main>
  <footer class="rodape" id="rodape"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/painel.js"></script>
</body>
</html>
