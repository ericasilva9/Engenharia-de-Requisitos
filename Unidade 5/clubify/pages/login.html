<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Clubify</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../" data-page="login" class="ref-login">
  <header class="top" id="topo"></header>

  <main>
    <div class="card login-card">
      
      <div class="bd">
        <h3 class="center" style="font-size:22px">Área do Sócio</h3><span class="ul c" style="margin-bottom:30px"></span>
        <form id="form-login" novalidate>
          <div class="stack">
            <div class="field"><label for="email">E-mail *</label><input type="email" id="email" autocomplete="username" placeholder="E-mail*"></div>
            <div class="field"><label for="senha">Senha*</label><input type="password" id="senha" autocomplete="current-password" placeholder="Senha*"></div>
          </div>
          <div class="aviso erro hidden" id="msg-erro"></div>
          <div class="aviso info hidden" id="msg-aviso"></div>
          <button class="btn block" type="submit" style="margin-top:28px">Acessar</button>
        </form>
        <p class="muted center" style="margin-top:20px">Ainda não é sócio? <a class="link-azul" href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>
  </main>
  <footer class="rodape" id="rodape"></footer>

  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
